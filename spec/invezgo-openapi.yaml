openapi: 3.0.0
paths:
  /analysis/list/stock:
    get:
      description: "

        \    Mendapatkan daftar lengkap semua perusahaan yang tercatat di Bursa
        Efek Indonesia (BEI).


        \    Fitur:

        \    - Termasuk perusahaan IPO terbaru

        \    - Tidak termasuk perusahaan yang sudah delisting

        \    - Dilengkapi dengan logo perusahaan


        \    Penggunaan:

        \    - Untuk mendapatkan kode saham yang valid

        \    - Sebagai referensi untuk endpoint lainnya

        \    - Untuk menampilkan daftar saham di website


        \    Update: Setiap ada perubahan data perusahaan atau IPO Baru


        \    ---

        \    [English]


        \    Get a complete list of all companies listed on the Indonesia Stock
        Exchange (IDX).


        \    Features:

        \    - Includes latest IPO companies

        \    - Excludes delisted companies

        \    - Complete with company logos


        \    Usage:

        \    - To get valid stock codes

        \    - As reference for other endpoints

        \    - To display stock list on website


        \    Update: Every time there is a change in company data or new IPO

        \    "
      operationId: AnalysisController_getStockList
      parameters: []
      responses:
        "200":
          description: Berhasil mendapatkan daftar perusahaan tercatat di BEI
          content:
            application/json:
              example:
                - code: BBCA
                  name: Bank Central Asia
                  sector: Keuangan
                  logo: https://storage.invezgo.com/icon/BBCA.png
                - code: BBRI
                  name: Bank Rakyat Indonesia
                  sector: Keuangan
                  logo: https://storage.invezgo.com/icon/BBRI.png
                - code: BMRI
                  name: Bank Mandiri
                  sector: Keuangan
                  logo: https://storage.invezgo.com/icon/BMRI.png
        "401":
          description: API Key tidak valid atau tidak ditemukan - pastikan API Key sudah
            benar dan aktif
          content:
            application/json:
              example:
                statusCode: 401
                message: Authentication required
                error: Unauthorized
        "402":
          description: Paket berlangganan tidak mencukupi atau API Key sudah expired -
            silakan upgrade paket atau perpanjang API Key
          content:
            application/json:
              example:
                statusCode: 402
                message: Advance role user only
                error: Payment Required
        "422":
          description: Input tidak valid - pastikan parameter permintaan sudah benar
          content:
            application/json:
              example:
                statusCode: 422
                timestamp: 2025-12-31T13:25:18.372Z
                path: /analysis/.../BBB
                message: "`code`: Stock code must be at least 7 characters"
                error: UnprocessableEntityException
        "429":
          description: Melebihi batas permintaan API - silakan upgrade paket berlangganan
            atau tunggu reset quota
          content:
            application/json:
              example:
                statusCode: 429
                message: "ThrottlerException: Too Many Requests"
                error: Too Many Requests
      security:
        - Authorization: []
      summary: Stock List
      tags:
        - Indonesia Stock Data API
  /analysis/list/broker:
    get:
      description: "

        \    Mendapatkan daftar lengkap semua broker/sekuritas yang terdaftar
        sebagai anggota bursa di BEI.


        \    Fitur:

        \    - Mengikuti perkembangan MKBD (Member of Broker Dealer)

        \    - Kode broker 2 digit untuk identifikasi

        \    - Nama lengkap perusahaan sekuritas


        \    Penggunaan:

        \    - Untuk mendapatkan kode broker yang valid

        \    - Sebagai referensi untuk analisis transaksi broker

        \    - Untuk filter data berdasarkan broker tertentu


        \    Update: Setiap ada perubahan data broker atau ada broker baru


        \    ---

        \    [English]


        \    Get a complete list of all brokers/securities registered as
        exchange members at IDX.


        \    Features:

        \    - Follows MKBD (Member of Broker Dealer) updates

        \    - 2-digit broker code for identification

        \    - Full name of securities company


        \    Usage:

        \    - To get valid broker codes

        \    - As reference for broker transaction analysis

        \    - To filter data based on specific broker


        \    Update: Every time there is a change in broker data or new broker

        \    "
      operationId: AnalysisController_getBrokerList
      parameters: []
      responses:
        "200":
          description: Berhasil mendapatkan daftar broker/sekuritas di BEI
          content:
            application/json:
              example:
                - name: OSO SEKURITAS INDONESIA
                  code: AD
                - name: HARITA KENCANA SEKURITAS
                  code: AF
                - name: KIWOOM SEKURITAS INDONESIA
                  code: AG
        "401":
          description: API Key tidak valid atau tidak ditemukan - pastikan API Key sudah
            benar dan aktif
          content:
            application/json:
              example:
                statusCode: 401
                message: Authentication required
                error: Unauthorized
        "402":
          description: Paket berlangganan tidak mencukupi atau API Key sudah expired -
            silakan upgrade paket atau perpanjang API Key
          content:
            application/json:
              example:
                statusCode: 402
                message: Advance role user only
                error: Payment Required
        "422":
          description: Input tidak valid - pastikan parameter permintaan sudah benar
          content:
            application/json:
              example:
                statusCode: 422
                timestamp: 2025-12-31T13:25:18.372Z
                path: /analysis/.../BBB
                message: "`code`: Stock code must be at least 7 characters"
                error: UnprocessableEntityException
        "429":
          description: Melebihi batas permintaan API - silakan upgrade paket berlangganan
            atau tunggu reset quota
          content:
            application/json:
              example:
                statusCode: 429
                message: "ThrottlerException: Too Many Requests"
                error: Too Many Requests
      security:
        - Authorization: []
      summary: Broker List
      tags:
        - Indonesia Stock Data API
  /analysis/list/index:
    get:
      description: "

        \    Mendapatkan daftar lengkap semua index/indeks yang tersedia di BEI.


        \    Kategori Index:

        \    - **headline**: Index utama (COMPOSITE/IHSG, LQ45, IDX30, IDX80)

        \    - **sector**: Index sektoral (IDXENERGY, IDXFINANCE, IDXBASIC, dll)

        \    - **sharia**: Index syariah (JII, JII70, ISSI, dll)

        \    - **esg**: Index ESG/sustainability (SRI-KEHATI, IDXESGL, dll)

        \    - **factor**: Index berbasis faktor (IDXQ30, IDXV30, IDXG30,
        IDXHIDIV20)

        \    - **thematic**: Index tematik (IDXBUMN20, I-GRADE, dll)

        \    - **board**: Index papan pencatatan (MBX, DBX, ABX)

        \    - **partnership**: Index kerjasama (KOMPAS100, BISNIS-27, dll)

        \    - **smc**: Index Small-Mid Cap (IDXSMC-LIQ, IDXSMC-COM)


        \    Penggunaan:

        \    - Untuk mendapatkan kode index yang valid

        \    - Sebagai referensi untuk analisis pergerakan index

        \    - Untuk filter data berdasarkan kategori index


        \    Update: Setiap ada perubahan data index


        \    ---

        \    [English]


        \    Get a complete list of all indexes available at IDX.


        \    Index Categories:

        \    - **headline**: Main indexes (COMPOSITE/IHSG, LQ45, IDX30, IDX80)

        \    - **sector**: Sectoral indexes (IDXENERGY, IDXFINANCE, IDXBASIC,
        etc)

        \    - **sharia**: Sharia indexes (JII, JII70, ISSI, etc)

        \    - **esg**: ESG/sustainability indexes (SRI-KEHATI, IDXESGL, etc)

        \    - **factor**: Factor-based indexes (IDXQ30, IDXV30, IDXG30,
        IDXHIDIV20)

        \    - **thematic**: Thematic indexes (IDXBUMN20, I-GRADE, etc)

        \    - **board**: Board indexes (MBX, DBX, ABX)

        \    - **partnership**: Partnership indexes (KOMPAS100, BISNIS-27, etc)

        \    - **smc**: Small-Mid Cap indexes (IDXSMC-LIQ, IDXSMC-COM)


        \    Usage:

        \    - To get valid index codes

        \    - As reference for index movement analysis

        \    - To filter data based on index category


        \    Update: Every time there is a change in index data

        \    "
      operationId: AnalysisController_getIndexList
      parameters: []
      responses:
        "200":
          description: Berhasil mendapatkan daftar index di BEI
          content:
            application/json:
              example:
                - code: COMPOSITE
                  name: Indeks Harga Saham Gabungan (IHSG)
                  category: headline
                - code: LQ45
                  name: LQ45
                  category: headline
                - code: IDXFINANCE
                  name: IDX Sector Financials
                  category: sector
        "401":
          description: API Key tidak valid atau tidak ditemukan - pastikan API Key sudah
            benar dan aktif
          content:
            application/json:
              example:
                statusCode: 401
                message: Authentication required
                error: Unauthorized
        "402":
          description: Paket berlangganan tidak mencukupi atau API Key sudah expired -
            silakan upgrade paket atau perpanjang API Key
          content:
            application/json:
              example:
                statusCode: 402
                message: Advance role user only
                error: Payment Required
        "422":
          description: Input tidak valid - pastikan parameter permintaan sudah benar
          content:
            application/json:
              example:
                statusCode: 422
                timestamp: 2025-12-31T13:25:18.372Z
                path: /analysis/.../BBB
                message: "`code`: Stock code must be at least 7 characters"
                error: UnprocessableEntityException
        "429":
          description: Melebihi batas permintaan API - silakan upgrade paket berlangganan
            atau tunggu reset quota
          content:
            application/json:
              example:
                statusCode: 429
                message: "ThrottlerException: Too Many Requests"
                error: Too Many Requests
      security:
        - Authorization: []
      summary: Index List
      tags:
        - Indonesia Stock Data API
  /analysis/notation:
    get:
      description: "

        \    Mendapatkan daftar lengkap notasi khusus seluruh saham yang
        tercatat di Bursa Efek Indonesia (BEI), dikelompokkan berdasarkan kode
        saham dan tanggal berlaku.


        \    Informasi yang Disediakan:

        \    - Kode saham perusahaan

        \    - Tanggal berlaku notasi

        \    - Kode notasi khusus

        \    - Deskripsi setiap notasi


        \    Penggunaan:

        \    - Untuk memantau status khusus suatu saham

        \    - Sebagai referensi risiko sebelum melakukan analisis atau
        transaksi

        \    - Untuk menampilkan riwayat notasi saham di website


        \    Update: Setiap ada perubahan notasi dari Bursa Efek Indonesia


        \    ---

        \    [English]


        \    Get a complete list of special notations for all stocks listed on
        the Indonesia Stock Exchange (IDX), grouped by stock code and effective
        date.


        \    Information Provided:

        \    - Company stock code

        \    - Notation effective date

        \    - Special notation code

        \    - Description of each notation


        \    Usage:

        \    - To monitor the special status of a stock

        \    - As a risk reference before analysis or trading

        \    - To display stock notation history on a website


        \    Update: Every time there is a notation change from the Indonesia
        Stock Exchange

        \    "
      operationId: AnalysisController_notation
      parameters: []
      responses:
        "200":
          description: Berhasil mendapatkan seluruh notasi saham
          content:
            application/json:
              example:
                - code: BBCA
                  date: 2025-01-01T00:00:00.000Z
                  list:
                    - notation: A
                      description: Adanya permohonan Pernyataan Pailit
        "401":
          description: API Key tidak valid atau tidak ditemukan - pastikan API Key sudah
            benar dan aktif
          content:
            application/json:
              example:
                statusCode: 401
                message: Authentication required
                error: Unauthorized
        "402":
          description: Paket berlangganan tidak mencukupi atau API Key sudah expired -
            silakan upgrade paket atau perpanjang API Key
          content:
            application/json:
              example:
                statusCode: 402
                message: Advance role user only
                error: Payment Required
        "422":
          description: Input tidak valid - pastikan parameter permintaan sudah benar
          content:
            application/json:
              example:
                statusCode: 422
                timestamp: 2025-12-31T13:25:18.372Z
                path: /analysis/.../BBB
                message: "`code`: Stock code must be at least 7 characters"
                error: UnprocessableEntityException
        "429":
          description: Melebihi batas permintaan API - silakan upgrade paket berlangganan
            atau tunggu reset quota
          content:
            application/json:
              example:
                statusCode: 429
                message: "ThrottlerException: Too Many Requests"
                error: Too Many Requests
      security:
        - Authorization: []
      summary: Stock Notation List
      tags:
        - Indonesia Stock Data API
  /analysis/information/{code}:
    get:
      description: "

        \    Mendapatkan informasi lengkap dan detail tentang perusahaan
        berdasarkan kode saham.


        \    Informasi yang Disediakan:

        \    - Data perusahaan (nama, alamat, website)

        \    - Klasifikasi industri dan sektor bisnis

        \    - Tanggal listing di bursa

        \    - NPWP dan informasi legal


        \    Jenis Data: Cross Section (data snapshot terbaru)


        \    Update: Bulanan sesuai laporan masing-masing perusahaan


        \    Contoh Penggunaan:

        \    - Untuk menampilkan profil perusahaan di website

        \    - Sebagai referensi untuk analisis fundamental

        \    - Untuk validasi data perusahaan


        \    ---

        \    [English]


        \    Get complete and detailed information about a company based on
        stock code.


        \    Information Provided:

        \    - Company data (name, address, website)

        \    - Industry classification and business sector

        \    - Listing date on exchange

        \    - Tax ID and legal information


        \    Data Type: Cross Section (latest snapshot data)


        \    Update: Monthly according to each company's report


        \    Usage Examples:

        \    - To display company profile on website

        \    - As reference for fundamental analysis

        \    - To validate company data

        \    "
      externalDocs:
        url: https://invezgo.com/id/space/BBCA
        description: Lihat contoh penggunaan di website Invezgo
      operationId: AnalysisController_information
      parameters:
        - name: code
          required: true
          in: path
          description: Kode saham (4-6 karakter) - dapatkan dari `/list/stock`
          schema:
            example: BBCA
            type: string
      responses:
        "200":
          description: Berhasil mendapatkan informasi lengkap perusahaan
          content:
            application/json:
              example:
                code: BBCA
                address: "Menara BCA, Grand Indonesia\r

                  Jalan MH Thamrin No. 1\r

                  Jakarta 10310"
                industry: Bank
                subsindustry: Bank
                activity: "Jasa Perbankan "
                name: Bank Central Asia
                npwp: 01.308.449.6-091.000
                board: Utama
                sector: Keuangan
                subsector: Bank
                listing_date: 2000-05-30T17:00:00.000Z
                website: www.bca.co.id
                logo: https://storage.invezgo.com/icon/BBCA.png
                category:
                  - SYARIAH
                  - IDXENERGY
                administration: null
                description: null
                ipo_pct: null
                ipo_price: null
                ipo_share: null
                ipo_underwriter: null
                nominal_price: null
                commissioner:
                  - name: Cyrillus Harinowo
                    position: Independent Commissioner
                director:
                  - name: Antonius Widodo Mulyono
                    position: Director
                subsidiary:
                  - name: BCA Finance Ltd
                    percentage: 100
                notation:
                  - notation: A
                    description: Adanya permohonan Pernyataan Pailit
        "401":
          description: API Key tidak valid atau tidak ditemukan - pastikan API Key sudah
            benar dan aktif
          content:
            application/json:
              example:
                statusCode: 401
                message: Authentication required
                error: Unauthorized
        "402":
          description: Paket berlangganan tidak mencukupi atau API Key sudah expired -
            silakan upgrade paket atau perpanjang API Key
          content:
            application/json:
              example:
                statusCode: 402
                message: Advance role user only
                error: Payment Required
        "422":
          description: Input tidak valid - pastikan parameter permintaan sudah benar
          content:
            application/json:
              example:
                statusCode: 422
                timestamp: 2025-12-31T13:25:18.372Z
                path: /analysis/.../BBB
                message: "`code`: Stock code must be at least 7 characters"
                error: UnprocessableEntityException
        "429":
          description: Melebihi batas permintaan API - silakan upgrade paket berlangganan
            atau tunggu reset quota
          content:
            application/json:
              example:
                statusCode: 429
                message: "ThrottlerException: Too Many Requests"
                error: Too Many Requests
      security:
        - Authorization: []
      summary: Company Information
      tags:
        - Indonesia Stock Data API
  /analysis/top/change:
    get:
      description: "

        \    Mendapatkan daftar saham dengan kenaikan dan penurunan harga
        terbesar pada hari tertentu, dilengkapi dengan data grafik 5 hari ke
        belakang.


        \    Fitur:

        \    - Top Gainer: Saham dengan kenaikan perubahan harga tertinggi

        \    - Top Loser: Saham dengan penurunan perubahan harga terbesar

        \    - Graph: Data perubahan harga 5 hari ke belakang untuk setiap saham


        \    Jenis Data: Cross Section + Time Series (data harian + grafik)


        \    Update: End of Day (EOD) setiap hari setelah jam 18:00 WIB


        \    Terbatas untuk data 2 tahun terakhir

        \    Data Awal: 2010-01-01 [ENTERPRISE]


        \    Catatan:

        \    - Data tidak tersedia pada hari libur atau weekend

        \    - Gunakan tanggal hari kerja untuk hasil terbaik

        \    - Setiap saham dilengkapi dengan data grafik 5 hari


        \    Contoh Penggunaan:

        \    - Dashboard Top Gainer/Loser dengan mini chart

        \    - Analisa momentum harian dengan tren

        \    - Identifikasi saham yang trending dengan visualisasi


        \    ---

        \    [English]


        \    Get a list of stocks with the largest price increases and decreases
        on a specific day, complete with 5-day historical graph data.


        \    Features:

        \    - Top Gainer: Stocks with the highest price change increase

        \    - Top Loser: Stocks with the largest price change decrease

        \    - Graph: 5-day historical price change data for each stock


        \    Data Type: Cross Section + Time Series (daily data + graph)


        \    Update: End of Day (EOD) every day after 18:00 WIB


        \    Limited to data for the last 2 years

        \    Initial Data: 2010-01-01 [ENTERPRISE]


        \    Notes:

        \    - Data not available on holidays or weekends

        \    - Use business days for best results

        \    - Each stock includes 5-day graph data


        \    Usage Examples:

        \    - Top Gainer/Loser Dashboard with mini charts

        \    - Daily momentum analysis with trends

        \    - Identify trending stocks with visualization

        \    "
      externalDocs:
        url: https://invezgo.com/id/dashboard
        description: Lihat contoh penggunaan di dashboard Invezgo
      operationId: AnalysisController_topChange
      parameters:
        - name: date
          required: true
          in: query
          description: "Tanggal (format: YYYY-MM-DD)"
          schema:
            example: 2024-12-30
            type: string
        - name: filter_column
          required: false
          in: query
          description: "Kolom stock_prices untuk filter (optional). Pilihan: change,
            value, volume, ratio"
          schema:
            enum:
              - change
              - value
              - volume
              - ratio
            type: string
        - name: filter_operator
          required: false
          in: query
          description: "Operator perbandingan untuk filter (optional). Pilihan: <, >, =,
            >=, <=, !="
          schema:
            enum:
              - <
              - ">"
              - =
              - ">="
              - <=
              - "!="
            type: string
        - name: filter_value
          required: false
          in: query
          description: "Nilai untuk perbandingan filter (optional). Contoh: 5 (untuk
            filter change > 5)"
          schema:
            example: 0
            type: string
      responses:
        "200":
          description: Berhasil mendapatkan data top gainer dan loser dengan grafik 5 hari
          content:
            application/json:
              example:
                gain:
                  - code: WAPO
                    name: Wahana Pronatural
                    price: 136
                    change: 34.65
                    value: 1500000000
                    volume: 10000000
                    logo: https://storage.invezgo.com/icon/WAPO.png
                    graph:
                      - date: 2024-01-15
                        value: 1.25
                      - date: 2024-01-16
                        value: 2.1
                      - date: 2024-01-17
                        value: -0.85
                      - date: 2024-01-18
                        value: 3.45
                      - date: 2024-01-19
                        value: 1.75
                loss:
                  - code: INPC
                    name: Bank Artha Graha Internasional
                    price: 214
                    change: -13.01
                    value: 800000000
                    volume: 5000000
                    logo: https://storage.invezgo.com/icon/INPC.png
                    graph:
                      - date: 2024-01-15
                        value: -2.25
                      - date: 2024-01-16
                        value: -1.1
                      - date: 2024-01-17
                        value: -3.85
                      - date: 2024-01-18
                        value: -0.45
                      - date: 2024-01-19
                        value: -2.75
        "204":
          description: Data tidak tersedia - kemungkinan hari libur atau weekend
          content:
            application/json:
              example:
                gain: []
                loss: []
        "401":
          description: API Key tidak valid atau tidak ditemukan - pastikan API Key sudah
            benar dan aktif
          content:
            application/json:
              example:
                statusCode: 401
                message: Authentication required
                error: Unauthorized
        "402":
          description: Paket berlangganan tidak mencukupi atau API Key sudah expired -
            silakan upgrade paket atau perpanjang API Key
          content:
            application/json:
              example:
                statusCode: 402
                message: Advance role user only
                error: Payment Required
        "422":
          description: Input tidak valid - pastikan parameter permintaan sudah benar
          content:
            application/json:
              example:
                statusCode: 422
                timestamp: 2025-12-31T13:25:18.372Z
                path: /analysis/.../BBB
                message: "`code`: Stock code must be at least 7 characters"
                error: UnprocessableEntityException
        "429":
          description: Melebihi batas permintaan API - silakan upgrade paket berlangganan
            atau tunggu reset quota
          content:
            application/json:
              example:
                statusCode: 429
                message: "ThrottlerException: Too Many Requests"
                error: Too Many Requests
      security:
        - Authorization: []
      summary: Top Gainer & Loser
      tags:
        - Indonesia Stock Data API
  /analysis/top/foreign:
    get:
      description: "

        \    Mendapatkan daftar saham dengan akumulasi dan distribusi asing
        terbesar pada hari tertentu, dilengkapi dengan data grafik 5 hari ke
        belakang.


        \    Fitur:

        \    - Top Akumulasi: Saham dengan akumulasi asing tertinggi

        \    - Top Distribusi: Saham dengan distribusi asing terbesar

        \    - Graph: Data persentase foreign dari total value 5 hari ke
        belakang untuk setiap saham


        \    Jenis Data: Cross Section + Time Series (data harian + grafik)


        \    Update: End of Day (EOD) setiap hari setelah jam 18:00 WIB


        \    Terbatas untuk data 2 tahun terakhir

        \    Data Awal: 2010-01-01 [ENTERPRISE]


        \    Catatan:

        \    - Data tidak tersedia pada hari libur atau weekend

        \    - Gunakan tanggal hari kerja untuk hasil terbaik

        \    - Setiap saham dilengkapi dengan data grafik 5 hari


        \    Contoh Penggunaan:

        \    - Analisa pergerakan asing dengan tren

        \    - Identifikasi saham favorit asing dengan visualisasi

        \    - Analisa sentimen pasar dengan mini chart


        \    ---

        \    [English]


        \    Get a list of stocks with the largest foreign accumulation and
        distribution on a specific day, complete with 5-day historical graph
        data.


        \    Features:

        \    - Top Accumulation: Stocks with the highest foreign accumulation

        \    - Top Distribution: Stocks with the largest foreign distribution

        \    - Graph: 5-day historical foreign percentage data for each stock


        \    Data Type: Cross Section + Time Series (daily data + graph)


        \    Update: End of Day (EOD) every day after 18:00 WIB


        \    Limited to data for the last 2 years

        \    Initial Data: 2010-01-01 [ENTERPRISE]


        \    Notes:

