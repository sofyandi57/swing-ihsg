  /analysis/sector/rotation:
    get:
      description: "

        \    Mendapatkan data rotasi sektor untuk visualisasi pergerakan relatif
        indeks sektoral atau saham.


        \    Data yang Disediakan:

        \    - Jika base = COMPOSITE: Pergerakan relatif indeks sektoral
        terhadap COMPOSITE

        \    - Jika base = index lain: Pergerakan relatif saham dalam index
        tersebut

        \    - Koordinat X dan Y untuk plotting chart

        \    - Trail data harian atau mingguan untuk melihat pergerakan historis

        \    - Klasifikasi kuadran (leading, weakening, lagging, improving)


        \    Parameter:

        \    - **from**: Tanggal mulai (format: YYYY-MM-DD)

        \    - **to**: Tanggal akhir (format: YYYY-MM-DD)

        \    - **base**: Base index untuk filter (default: COMPOSITE). Pilihan:
        COMPOSITE, IDX30, IDX80, LQ45, IDXFINANCE, IDXENERGY, dll

        \    - **length**: Periode perhitungan (default: 10, range: 5-50)

        \    - **interval**: Interval perhitungan trail. Pilihan: daily, weekly
        (default: weekly)

        \    - **tail**: Jumlah titik trail yang ditampilkan (default: 5, range:
        1-52)

        \    - **limit**: Jumlah saham yang ditampilkan (optional, hanya untuk
        base selain COMPOSITE, max: 50)

        \    - **filter**: Filter tambahan untuk pencarian kode/nama saham
        (optional, hanya untuk base selain COMPOSITE)

        \    - **filter_column**: Kolom stock_prices untuk filter (optional,
        hanya untuk base selain COMPOSITE). Pilihan: change, value, volume,
        foreign, freq, bdm, ritel, ratio, open, high, low, close

        \    - **filter_operator**: Operator perbandingan untuk filter
        (optional). Pilihan: <, >, =, >=, <=, !=

        \    - **filter_value**: Nilai untuk perbandingan filter (optional).
        Contoh: 5 (untuk filter change > 5)


        \    Filter Stock (hanya untuk base selain COMPOSITE):

        \    Anda dapat memfilter saham berdasarkan nilai kolom di tabel
        stock_prices pada tanggal terakhir dalam range.


        \    Contoh Filter:

        \    - filter_column=change&filter_operator=>&filter_value=5 → Saham
        dengan change > 5%

        \    - filter_column=value&filter_operator=>=&filter_value=1000000000 →
        Saham dengan value >= 1 Miliar

        \    - filter_column=volume&filter_operator=>&filter_value=1000000 →
        Saham dengan volume > 1 Juta

        \    - filter_column=foreign&filter_operator=>&filter_value=0 → Saham
        dengan net foreign buy > 0


        \    Jenis Data: Time Series


        \    Update: Setiap hari bursa setelah penutupan pasar


        \    Terbatas untuk data 2 tahun terakhir

        \    Data Awal: 2010-01-01 [ENTERPRISE]


        \    Catatan:

        \    - Ketika base = COMPOSITE: menampilkan data indeks sektoral

        \    - Ketika base diubah ke index lain (misal IDX30): menampilkan data
        saham dari index tersebut


        \    Contoh Penggunaan:

        \    - Analisis rotasi sektor (base = COMPOSITE)

        \    - Identifikasi sektor yang outperform/underperform

        \    - Analisis performa saham dalam index tertentu (base = IDX30,
        IDX80, dll)


        \    ---

        \    [English]


        \    Get sector rotation data for visualizing relative movement of
        sectoral indices or stocks.


        \    Data Provided:

        \    - If base = COMPOSITE: Relative movement of sectoral indices
        against COMPOSITE

        \    - If base = other index: Relative movement of stocks within that
        index

        \    - X and Y coordinates for chart plotting

        \    - Daily or weekly trail data for historical movement visualization

        \    - Quadrant classification (leading, weakening, lagging, improving)


        \    Parameters:

        \    - **from**: Start date (format: YYYY-MM-DD)

        \    - **to**: End date (format: YYYY-MM-DD)

        \    - **base**: Base index for filtering (default: COMPOSITE). Options:
        COMPOSITE, IDX30, IDX80, LQ45, IDXFINANCE, IDXENERGY, etc

        \    - **length**: Calculation period (default: 10, range: 5-50)

        \    - **interval**: Trail calculation interval. Options: daily, weekly
        (default: weekly)

        \    - **tail**: Number of trail points to display (default: 5, range:
        1-52)

        \    - **limit**: Number of stocks to display (optional, only for base
        other than COMPOSITE, max: 50)

        \    - **filter**: Additional filter for stock code/name search
        (optional, only for base other than COMPOSITE)

        \    - **filter_column**: Column from stock_prices to filter (optional,
        only for base other than COMPOSITE). Options: change, value, volume,
        foreign, freq, bdm, ritel, ratio, open, high, low, close

        \    - **filter_operator**: Comparison operator (optional). Options: <,
        >, =, >=, <=, !=

        \    - **filter_value**: Value for comparison (optional). Example: 5
        (for filter change > 5)


        \    Stock Filter (only for base other than COMPOSITE):

        \    You can filter stocks based on column values in the stock_prices
        table on the last date in the range.


        \    Filter Examples:

        \    - filter_column=change&filter_operator=>&filter_value=5 → Stocks
        with change > 5%

        \    - filter_column=value&filter_operator=>=&filter_value=1000000000 →
        Stocks with value >= 1 Billion

        \    - filter_column=volume&filter_operator=>&filter_value=1000000 →
        Stocks with volume > 1 Million

        \    - filter_column=foreign&filter_operator=>&filter_value=0 → Stocks
        with net foreign buy > 0


        \    Data Type: Time Series


        \    Update: Every trading day after market close


        \    Limited to data for the last 2 years

        \    Initial Data: 2010-01-01 [ENTERPRISE]


        \    Notes:

        \    - When base = COMPOSITE: displays sectoral index data

        \    - When base is changed to another index (e.g., IDX30): displays
        stock data from that index


        \    Usage Examples:

        \    - Sector rotation analysis (base = COMPOSITE)

        \    - Identify outperforming/underperforming sectors

        \    - Analyze stock performance within specific index (base = IDX30,
        IDX80, etc)

        \        "
      operationId: AnalysisController_sectorRotation
      parameters:
        - name: from
          required: true
          in: query
          description: "Tanggal mulai (format: YYYY-MM-DD)"
          schema:
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2024-12-01
            type: string
        - name: to
          required: true
          in: query
          description: "Tanggal akhir (format: YYYY-MM-DD)"
          schema:
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2024-12-31
            type: string
        - name: base
          required: false
          in: query
          description: "Benchmark index untuk perbandingan (default: COMPOSITE)"
          schema:
            enum:
              - COMPOSITE
              - IDX30
              - IDX80
              - LQ45
              - IDXFINANCE
              - IDXENERGY
              - IDXBASIC
              - IDXINDUST
              - IDXNONCYC
              - IDXCYCLIC
              - IDXHEALTH
              - IDXPROPERT
              - IDXTECHNO
              - IDXINFRA
              - IDXTRANS
            type: string
        - name: length
          required: false
          in: query
          description: "Periode smoothing untuk RS-Ratio dan RS-Momentum sesuai interval
            yang dipilih (default: 10)"
          schema:
            minimum: 5
            maximum: 50
            default: 10
            example: 10
            type: string
        - name: interval
          required: false
          in: query
          description: "Interval trail dan normalisasi RRG: daily atau weekly"
          schema:
            enum:
              - daily
              - weekly
            type: string
        - name: tail
          required: false
          in: query
          description: "Jumlah trailing points yang ditampilkan (default: 5)"
          schema:
            minimum: 1
            maximum: 52
            default: 5
            example: 5
            type: string
        - name: limit
          required: false
          in: query
          description: Limit jumlah hasil (hanya untuk base selain COMPOSITE)
          schema:
            minimum: 1
            maximum: 50
            example: 20
            type: string
        - name: filter
          required: false
          in: query
          description: Filter untuk pencarian kode/nama saham (hanya untuk base selain
            COMPOSITE)
          schema:
            default: ""
            example: ""
            type: string
        - name: filter_column
          required: false
          in: query
          description: Kolom stock_prices untuk filter (change, value, volume, foreign,
            freq, bdm, ritel, ratio, open, high, low, close)
          schema:
            enum:
              - change
              - value
              - volume
              - foreign
              - freq
              - bdm
              - ritel
              - ratio
              - open
              - high
              - low
              - close
            type: string
        - name: filter_operator
          required: false
          in: query
          description: Operator perbandingan (<, >, =, >=, <=, !=)
          schema:
            enum:
              - <
              - ">"
              - =
              - ">="
              - <=
              - "!="
            type: string
        - name: filter_value
          required: false
          in: query
          description: Nilai untuk perbandingan filter
          schema:
            example: 0
            type: string
      responses:
        "200":
          description: Data rotasi sektor lengkap dan tersedia
          content:
