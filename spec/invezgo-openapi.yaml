  /analysis/running-trade/{code}:
    get:
      description: "

        \    Mendapatkan daftar data transaksi running trade realtime/historis
        untuk kode saham tertentu.


        \    Data yang Disediakan:

        \    - Waktu transaksi, harga, volume (lembar)

        \    - Jenis aksi BUY atau SELL

        \    - Informasi broker pembeli dan penjual (kode, tipe investor)

        \    - Jenis pasar (RG, NG, TN)


        \    Query Parameters:

        \    - date: Tanggal transaksi (format YYYY-MM-DD, default hari ini)

        \    - page: Halaman pagination (default 1)

        \    - limit: Batas data per halaman (maksimal 150, default 50)

        \    - type: Filter tipe transaksi (ALL, BUY, SELL - default ALL)

        \    - orderby: Pengurutan (TIME, PRICE, VOLUME - default TIME)

        \    - minimum: Filter transaksi minimum volume (dalam lembar)

        \    - maximum: Filter transaksi maksimum volume (dalam lembar)

        \    - market: Filter pasar (ALL, NG, RG, TN - default ALL)

        \    - pricefrom: Filter harga minimal

        \    - priceto: Filter harga maksimal

        \    - timefrom: Filter waktu transaksi minimal (format HH:mm atau
        HH:mm:ss)

        \    - timeto: Filter waktu transaksi maksimal (format HH:mm atau
        HH:mm:ss)

        \    - sort: Urutan (ASC, DESC - default ASC)


        \    ---

        \    [English]


        \    Get realtime/historical running trade transaction data for a
        specific stock code.


        \    Data Provided:

        \    - Transaction time, price, volume (shares)

        \    - Action type BUY or SELL

        \    - Buyer and seller broker information (code, investor type)

        \    - Market type (RG, NG, TN)


        \    Query Parameters:

        \    - date: Transaction date (format YYYY-MM-DD, default today)

        \    - page: Pagination page (default 1)

        \    - limit: Data limit per page (maximum 150, default 50)

        \    - type: Transaction type filter (ALL, BUY, SELL - default ALL)

        \    - orderby: Sort field (TIME, PRICE, VOLUME - default TIME)

        \    - minimum: Minimum transaction volume filter (in shares)

        \    - maximum: Maximum transaction volume filter (in shares)

        \    - market: Market filter (ALL, NG, RG, TN - default ALL)

        \    - pricefrom: Minimum price filter

        \    - priceto: Maximum price filter

        \    - timefrom: Minimum transaction time filter (format HH:mm or
        HH:mm:ss)

        \    - timeto: Maximum transaction time filter (format HH:mm or
        HH:mm:ss)

        \    - sort: Sort direction (ASC, DESC - default ASC)

        \    "
      externalDocs:
        url: https://invezgo.com/id/dashboard
        description: Lihat contoh penggunaan di dashboard Invezgo
      operationId: AnalysisController_stockRunningTrade
      parameters:
        - name: code
          required: true
          in: path
          description: Kode saham (4-6 karakter) - dapatkan dari `/list/stock`
          schema:
            example: BBCA
            type: string
        - name: date
          required: true
          in: query
          description: "Tanggal (format: YYYY-MM-DD)"
          schema:
            example: 2026-03-25
            type: string
        - name: page
          required: false
          in: query
          description: "Halaman data (default: 1)"
          schema:
            example: 1
            type: string
        - name: limit
          required: false
          in: query
          description: "Batas jumlah data per halaman (maksimal 150, default: 50)"
          schema:
            example: 50
            type: string
        - name: type
          required: false
          in: query
          description: "Filter tipe transaksi (ALL, BUY, SELL, default: ALL)"
          schema:
            enum:
              - ALL
              - BUY
              - SELL
            type: string
        - name: orderby
          required: false
          in: query
          description: "Pengurutan data berdasarkan (TIME, PRICE, VOLUME, default: TIME)"
          schema:
            enum:
              - TIME
              - PRICE
              - VOLUME
            type: string
        - name: minimum
          required: false
          in: query
          description: Filter transaksi minimum volume (dalam lot)
          schema:
            example: 100
            type: string
        - name: maximum
          required: false
          in: query
          description: Filter transaksi maksimum volume (dalam lot)
          schema:
            example: 10000
            type: string
        - name: market
          required: false
          in: query
          description: "Jenis pasar (ALL, NG, RG, TN, default: ALL)"
          schema:
            enum:
              - ALL
              - NG
              - RG
              - TN
            type: string
        - name: pricefrom
          required: false
          in: query
          description: Filter harga minimal (price >= pricefrom)
          schema:
            example: 9000
            type: string
        - name: priceto
          required: false
          in: query
          description: Filter harga maksimal (price <= priceto)
          schema:
            example: 9500
            type: string
        - name: timefrom
          required: false
          in: query
          description: "Filter waktu transaksi minimal (format: HH:mm atau HH:mm:ss)"
