      description: Sinkronisasi tier rate limit dan kuota API key dengan paket
        langganan aktif terbaru, serta membersihkan temporary rate-limit blocks.
      operationId: UsageController_syncApi
      parameters: []
      responses:
        "200":
          description: Tier API key berhasil disinkronkan dan temporary blocks dibersihkan
      security:
        - Authorization: []
      summary: Sync API Key Tier & Unblock
      tags:
        - Usage
  /usage/logs:
    get:
      description: Mengambil data riwayat logs penggunaan API milik user
        terautentikasi dari PostHog. Mengembalikan daftar log yang berisi ID
        log, tanggal/waktu (date), HTTP method, URL endpoint, User-Agent
        (access), HTTP status code (status), dan response time dalam milidetik
        (response_time). Parameter "from" tidak boleh lebih dari 30 hari lalu
        (default 24 jam lalu) dan "to" adalah waktu saat ini.
      operationId: UsageController_usageLogs
      parameters:
        - name: from
          required: false
          in: query
          description: "Tanggal awal format YYYY-MM-DD HH:mm:ss (maksimal 30 hari
            terakhir, default: 24 jam lalu)"
          schema:
            example: 2026-07-29 23:14:00
            type: string
        - name: to
          required: false
          in: query
          description: "Tanggal akhir format YYYY-MM-DD HH:mm:ss (default: tanggal/waktu
            saat ini)"
          schema:
            example: 2026-07-30 23:14:00
            type: string
        - name: status
          required: false
          in: query
          description: "Filter HTTP status code (opsional, contoh: 200)"
          schema:
            minimum: 100
            maximum: 599
            example: 200
            type: integer
        - name: limit
          required: false
          in: query
          description: "Jumlah maksimal log yang dikembalikan (opsional, maks: 320000,
            contoh: 100)"
          schema:
            minimum: 1
            maximum: 320000
            example: 100
            type: integer
      responses:
        "200":
          description: Data logs penggunaan API berhasil diambil dari PostHog
          content:
            application/json:
              schema:
                example:
                  - id: 019fb3be-c0be-7921-b815-3e06fd75a420
                    date: 2026-07-30T22:57:26.606000+07:00
                    method: GET
                    url: /users/session
                    access: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
                      like Gecko) Chrome/150.0.0.0 Safari/537.36
                    status: 200
                    response_time: 64
        "401":
          description: Token tidak valid atau sesi tidak tersedia
        "403":
          description: Akun tidak memiliki akses
      security:
        - Authorization: []
      summary: API Usage Logs
      tags:
        - Usage
