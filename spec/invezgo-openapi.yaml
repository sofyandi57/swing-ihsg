  /analysis/stalker/sector:
    get:
      description: "

        \    Mendapatkan data pergerakan harga indeks sektoral atau saham dalam
        rentang waktu tertentu.


        \    Data yang Disediakan:

        \    - Jika base = COMPOSITE: Pergerakan harga close indeks sektoral
        (IDXENERGY, IDXBASIC, IDXINDUST, IDXNONCYC, IDXCYCLIC, IDXHEALTH,
        IDXFINANCE, IDXPROPERT, IDXTECHNO, IDXINFRA, IDXTRANS, COMPOSITE)

        \    - Data time series untuk setiap indeks/saham

        \    - Data dinormalisasi ke base 100 untuk perbandingan


        \    Parameter:

        \    - **from**: Tanggal mulai (format: YYYY-MM-DD)

        \    - **to**: Tanggal akhir (format: YYYY-MM-DD)

        \    - **base**: Base index untuk filter (default: COMPOSITE). Pilihan:
        COMPOSITE, IDX30, IDX80, LQ45, IDXFINANCE, IDXENERGY, dll

        \    - **limit**: Jumlah saham yang ditampilkan (optional, hanya untuk
        base selain COMPOSITE, max: 100)

        \    - **filter**: Filter tambahan untuk pencarian kode/nama saham
        (optional, hanya untuk base selain COMPOSITE)

        \    - **filter_column**: Kolom stock_prices untuk filter (optional,
        hanya untuk base selain COMPOSITE). Pilihan: change, value, volume,
        foreign, freq, bdm, ritel, ratio, open, high, low, close

        \    - **filter_operator**: Operator perbandingan untuk filter
        (optional). Pilihan: <, >, =, >=, <=, !=

        \    - **filter_value**: Nilai untuk perbandingan filter (optional).
        Contoh: 5 (untuk filter change > 5)


        \    Filter Stock (hanya untuk base selain COMPOSITE):

        \    Anda dapat memfilter saham berdasarkan nilai kolom di tabel
        stock_prices pada tanggal terakhir dalam range.


        \    Contoh Filter:

        \    - filter_column=change&filter_operator=>&filter_value=5 → Saham
        dengan change > 5%

        \    - filter_column=value&filter_operator=>=&filter_value=1000000000 →
        Saham dengan value >= 1 Miliar

        \    - filter_column=volume&filter_operator=>&filter_value=1000000 →
        Saham dengan volume > 1 Juta

        \    - filter_column=foreign&filter_operator=>&filter_value=0 → Saham
        dengan net foreign buy > 0


        \    Jenis Data: Time Series


        \    Update: Setiap hari bursa setelah penutupan pasar


        \    Terbatas untuk data 2 tahun terakhir

        \    Data Awal: 2010-01-01 [ENTERPRISE]


        \    Catatan:

        \    - Ketika base = COMPOSITE: menampilkan data index prices (perilaku
        default)

        \    - Ketika base diubah ke index lain (misal IDX30): menampilkan data
        stock prices dari saham yang termasuk dalam index tersebut

        \    - Data dinormalisasi ke base 100 untuk memudahkan perbandingan
        performa


        \    Contoh Penggunaan:

        \    - Analisis rotasi sektor (base = COMPOSITE)

        \    - Perbandingan performa antar sektor (base = COMPOSITE)

        \    - Identifikasi sektor yang outperform/underperform (base =
        COMPOSITE)

        \    - Analisis performa saham dalam index tertentu (base = IDX30,
        IDX80, dll)

        \    - Filter saham berdasarkan index dan pencarian (base = IDX30,
        filter = BANK)


        \    ---

        \    [English]


        \    Get sectoral index or stock price movement data within a specific
        time range.


        \    Data Provided:

        \    - If base = COMPOSITE: Sectoral index close price movement
        (IDXENERGY, IDXBASIC, IDXINDUST, IDXNONCYC, IDXCYCLIC, IDXHEALTH,
        IDXFINANCE, IDXPROPERT, IDXTECHNO, IDXINFRA, IDXTRANS, COMPOSITE)

        \    - If base = IDX30, IDX80, etc: Stock price movement for stocks
        included in that index

        \    - Time series data for each index/stock

        \    - Data normalized to base 100 for comparison


        \    Parameters:

        \    - **from**: Start date (format: YYYY-MM-DD)

        \    - **to**: End date (format: YYYY-MM-DD)

        \    - **base**: Base index for filtering (default: COMPOSITE). Options:
        COMPOSITE, IDX30, IDX80, LQ45, IDXFINANCE, IDXENERGY, etc

        \    - **limit**: Number of stocks to display (optional, only for base
        other than COMPOSITE, max: 100)

        \    - **filter**: Additional filter for stock code/name search
        (optional, only for base other than COMPOSITE)

        \    - **filter_column**: Column from stock_prices to filter (optional,
        only for base other than COMPOSITE). Options: change, value, volume,
        foreign, freq, bdm, ritel, ratio, open, high, low, close

        \    - **filter_operator**: Comparison operator (optional). Options: <,
        >, =, >=, <=, !=

        \    - **filter_value**: Value for comparison (optional). Example: 5
        (for filter change > 5)


        \    Stock Filter (only for base other than COMPOSITE):

        \    You can filter stocks based on column values in the stock_prices
        table on the last date in the range.


        \    Filter Examples:

        \    - filter_column=change&filter_operator=>&filter_value=5 → Stocks
        with change > 5%

        \    - filter_column=value&filter_operator=>=&filter_value=1000000000 →
        Stocks with value >= 1 Billion

        \    - filter_column=volume&filter_operator=>&filter_value=1000000 →
        Stocks with volume > 1 Million

        \    - filter_column=foreign&filter_operator=>&filter_value=0 → Stocks
        with net foreign buy > 0


        \    Data Type: Time Series


        \    Update: Every trading day after market close


        \    Limited to data for the last 2 years

        \    Initial Data: 2010-01-01 [ENTERPRISE]


        \    Notes:

        \    - When base = COMPOSITE: displays index prices data (default
        behavior)

        \    - When base is changed to another index (e.g., IDX30): displays
        stock prices data from stocks included in that index

        \    - Data normalized to base 100 to facilitate performance comparison


        \    Usage Examples:

        \    - Sector rotation analysis (base = COMPOSITE)

        \    - Cross-sector performance comparison (base = COMPOSITE)

        \    - Identify outperforming/underperforming sectors (base = COMPOSITE)

        \    - Analyze stock performance within specific index (base = IDX30,
        IDX80, etc)

        \    - Filter stocks by index and search (base = IDX30, filter = BANK)

        \    "
      operationId: AnalysisController_sectorStalker
      parameters:
        - name: from
          required: true
          in: query
          description: "Tanggal mulai (format: YYYY-MM-DD)"
          schema:
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2024-12-01
            type: string
        - name: to
          required: true
          in: query
          description: "Tanggal akhir (format: YYYY-MM-DD)"
          schema:
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2024-12-31
            type: string
        - name: base
          required: false
          in: query
          description: "Base index untuk filter (default: COMPOSITE)"
          schema:
            enum:
              - COMPOSITE
              - IDX30
              - IDX80
              - LQ45
              - IDXFINANCE
              - IDXENERGY
            type: string
        - name: limit
          required: false
          in: query
          description: Limit jumlah hasil (optional, hanya untuk base selain COMPOSITE)
          schema:
            minimum: 1
            maximum: 100
            example: 10
            type: string
        - name: filter
          required: false
          in: query
          description: Filter tambahan untuk pencarian kode/nama saham (optional)
          schema:
            default: ""
            example: ""
            type: string
        - name: filter_column
          required: false
          in: query
          description: Kolom stock_prices untuk filter (change, value, volume, foreign,
            freq, bdm, ritel, ratio, open, high, low, close)
          schema:
            enum:
              - change
              - value
              - volume
              - foreign
              - freq
              - bdm
              - ritel
              - ratio
              - open
              - high
              - low
              - close
            type: string
        - name: filter_operator
          required: false
          in: query
          description: Operator perbandingan (<, >, =, >=, <=, !=)
          schema:
            enum:
              - <
              - ">"
              - =
              - ">="
              - <=
              - "!="
            type: string
        - name: filter_value
          required: false
          in: query
          description: Nilai untuk perbandingan filter
          schema:
            example: 0
            type: string
      responses:
        "200":
          description: Data pergerakan indeks sektoral lengkap dan tersedia
          content:
            application/json:
              example:
                index:
                  - index: IDXENERGY
                    data:
                      - date: 2024-12-02
                        value: 2150.5
                      - date: 2024-12-03
                        value: 2165.3
                  - index: IDXFINANCE
                    data:
                      - date: 2024-12-02
                        value: 1520.8
                      - date: 2024-12-03
                        value: 1535.2
        "204":
          description: Data indeks sektoral tidak tersedia
          content:
            application/json:
              example:
                index: []
        "401":
          description: API Key tidak valid atau tidak ditemukan - pastikan API Key sudah
            benar dan aktif
