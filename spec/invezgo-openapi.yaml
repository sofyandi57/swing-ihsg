  /analysis/queue/{code}:
    get:
      description: "

        \    Mendapatkan antrian order (order tracking) untuk saham pada harga,
        sisi, halaman, dan limit tertentu.


        \    Fitur:

        \    - Realtime order queue tracking dari third-party API.

        \    - Menampilkan detail antrian order: waktu order, ID order, volume
        order, volume yang masih open (outstanding), volume yang sudah done
        (terisi), nilai order (order_value), nilai yang masih open (open_value),
        dan nilai yang sudah done (done_value).

        \    - Dukungan fallback ke penyedia data alternatif saat terjadi
        gangguan.

        \    - Caching otomatis di luar jam perdagangan bursa.


        \    Parameter Input:

        \    - code: Kode saham (route parameter)

        \    - price: Tingkat harga saham yang ingin ditelusuri

        \    - side: Sisi transaksi (BUY / SELL)

        \    - page: Halaman data antrian (default: 0)

        \    - limit: Batas jumlah antrian yang ditampilkan (maksimal 50,
        default: 50)


        \    Contoh Penggunaan:

        \    - Melacak antrian antrean order pada level harga tertentu

        \    - Analisis distribusi antrean bid/offer secara detail

        \    - Mengidentifikasi order besar (institutional order) dalam antrean


        \    ---

        \    [English]


        \    Get order queue (order tracking) for a stock at a specific price,
        side, page, and limit.


        \    Features:

        \    - Real-time order queue tracking from third-party APIs.

        \    - Displays detailed order queue: order time, order ID, order
        volume, open volume (outstanding), completed volume (done), order value
        (order_value), open value (open_value), and completed value
        (done_value).

        \    - Alternative data provider fallback support during outages.

        \    - Automatic caching outside trading hours.


        \    Input Parameters:

        \    - code: Stock symbol (route parameter)

        \    - price: Stock price level to track

        \    - side: Transaction side (BUY / SELL)

        \    - page: Queue data page (default: 0)

        \    - limit: Limit on the number of queue entries to display (maximum
        50, default: 50)


        \    Usage Examples:

        \    - Track order queue at a specific price level

        \    - Detailed bid/offer queue distribution analysis

        \    - Identify large orders (institutional orders) in the queue

        \    "
      operationId: AnalysisController_getOrderQueue
      parameters:
        - name: code
          required: true
          in: path
          description: Kode saham (4-6 karakter) - dapatkan dari `/list/stock`
          schema:
            example: BBCA
            type: string
        - name: price
          required: true
          in: query
          description: Harga saham
          schema:
            example: 935
            type: string
        - name: side
          required: true
          in: query
          description: Sisi order (BUY atau SELL)
          schema:
            enum:
              - BUY
              - SELL
            type: string
        - name: page
          required: false
          in: query
          description: Halaman data
          schema:
            example: 0
            type: string
        - name: limit
          required: false
          in: query
          description: Batas jumlah data (maksimal 50)
          schema:
            example: 50
            type: string
      responses:
        "200":
          description: Berhasil mendapatkan data antrian order
          content:
            application/json:
              example:
                - time: 13:47:23
                  order_id: "202606150005094693"
                  order_volume: 400
                  open_volume: 0
                  done_volume: 400
                  order_value: 374000
                  open_value: 0
